<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识星球留言助手</title>
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="panel input-panel">
          <div class="brand-row">
            <div>
              <p class="eyebrow">公开网页版</p>
              <h1>社群合作留言助手</h1>
            </div>
            <span class="status-pill" id="statusPill">待输入</span>
          </div>

          <label class="field">
            <span>老师作品或主页链接</span>
            <input id="urlInput" type="url" placeholder="粘贴小红书 / 抖音 / 视频号 / 公众号文章 / 主页链接" />
          </label>

          <label class="field">
            <span>内容补充</span>
            <textarea id="noteInput" rows="4" placeholder="可选：复制一段老师内容，或简单写主题、观点、案例、用户需求。默认目标是邀请老师来知识星球做付费社群。"></textarea>
          </label>

          <div class="control-grid">
            <label class="field">
              <span>留言目标</span>
              <select id="goalInput">
                <option value="引发思考">引发思考</option>
                <option value="轻触达">轻触达</option>
                <option value="邀请私信">邀请私信</option>
              </select>
            </label>
            <label class="field">
              <span>语气</span>
              <select id="toneInput">
                <option value="真诚自然">真诚自然</option>
                <option value="专业克制">专业克制</option>
                <option value="温暖亲近">温暖亲近</option>
              </select>
            </label>
          </div>

          <button class="primary-button" id="generateButton">生成 3 条留言</button>

          <div class="notice">
            <strong>建议：</strong>系统会优先读取链接内容；如果平台限制读取，就把老师内容、观点或评论区问题粘到补充信息里。评论区先不提合作、不提平台、不提付费，先让老师觉得自己的内容值得被长期承接。
          </div>
        </div>

        <div class="panel result-panel">
          <div class="section-title">
            <div>
              <p class="eyebrow">输出结果</p>
              <h2>社群适配 + 3 条留言</h2>
            </div>
            <button class="ghost-button" id="copyAllButton" disabled>复制全部</button>
          </div>

          <div class="page-card" id="pageCard">
            <p class="muted">粘贴链接后，这里会显示内容适不适合做知识星球、适合从哪个角度留言。</p>
          </div>

          <div class="comments" id="comments"></div>
        </div>
      </section>
    </main>
    <script src="./script.js?v=8"></script>
  </body>
</html>
